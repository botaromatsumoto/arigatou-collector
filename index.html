<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありがとうコレクター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #fff9e6 0%, #ffe8f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #c0392b;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 40px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }

    #recordBtn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 6px 20px rgba(231,76,60,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 auto 28px;
    }

    #recordBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 28px rgba(231,76,60,0.5);
    }

    #recordBtn:disabled { cursor: not-allowed; opacity: 0.6; }

    #recordBtn.recording {
      animation: pulse 0.8s ease-in-out infinite;
      background: linear-gradient(135deg, #e74c3c, #922b21);
    }

    #recordBtn.countdown {
      background: linear-gradient(135deg, #f39c12, #d68910);
      box-shadow: 0 6px 20px rgba(243,156,18,0.4);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); }
      50% { box-shadow: 0 0 0 20px rgba(231,76,60,0); }
    }

    .mic-icon { font-size: 2.4rem; }
    #countdown { font-size: 3.5rem; font-weight: bold; color: white; display: none; }

    #recordBtn.countdown .mic-icon { display: none; }
    #recordBtn.countdown .btn-label { display: none; }
    #recordBtn.countdown #countdown { display: block; }
    #recordBtn.recording .mic-icon { display: none; }
    #recordBtn.recording .btn-label { display: none; }
    #recordBtn.recording #countdown { display: block; }

    .count-area {
      background: #fff9e6;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .count-label { font-size: 0.85rem; color: #888; margin-bottom: 4px; }
    .count-number { font-size: 2.2rem; font-weight: bold; color: #e74c3c; }
    .count-unit { font-size: 1rem; color: #c0392b; margin-left: 4px; }

    #status {
      min-height: 24px;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 20px;
    }
    #status.success { color: #27ae60; font-weight: bold; }
    #status.error { color: #e74c3c; }

    .action-buttons { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-play { background: #3498db; color: white; }
    .btn-download { background: #27ae60; color: white; }
    .btn-delete { background: #f8f8f8; color: #e74c3c; border: 2px solid #f5c6c6; font-size: 0.9rem; }

    .list-section { margin-top: 28px; text-align: left; }
    .list-title { font-size: 0.85rem; color: #aaa; margin-bottom: 10px; padding-left: 2px; }

    #recordingList {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.88rem;
      color: #555;
    }

    .list-item-left { display: flex; align-items: center; gap: 8px; }
    .list-num { font-weight: bold; color: #e74c3c; min-width: 24px; }

    .list-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.1s, background 0.1s;
    }
    .list-delete:hover { color: #e74c3c; background: #fee; }

    .empty-msg { color: #ccc; font-size: 0.9rem; text-align: center; padding: 16px; }

    .name-input-area {
      margin-bottom: 24px;
      text-align: left;
    }
    .name-input-area label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 6px;
    }
    .name-input-area input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #f5c6c6;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .name-input-area input:focus {
      border-color: #e74c3c;
    }

    .list-name { font-weight: bold; color: #333; }
    .list-time { color: #aaa; font-size: 0.8rem; }
  </style>
</head>
<body>

  <h1>ありがとうコレクター</h1>
  <p class="subtitle">みんなの「ありがとう」を集めてひとつの音声にします</p>

  <div class="card">
    <div class="name-input-area">
      <label for="nameInput">お名前を入力してください</label>
      <input type="text" id="nameInput" placeholder="例：田中 太郎" maxlength="30">
    </div>

    <button id="recordBtn" title="タップして録音">
      <span class="mic-icon">🎤</span>
      <span class="btn-label">タップして<br>録音（3秒）</span>
      <span id="countdown">3</span>
    </button>

    <div class="count-area">
      <div class="count-label">集まった「ありがとう」</div>
      <div>
        <span class="count-number" id="countNum">0</span>
        <span class="count-unit">件</span>
      </div>
    </div>

    <div id="status">ボタンを押してください</div>

    <div class="action-buttons">
      <button class="btn btn-play" id="playAllBtn" disabled>▶ まとめて再生</button>
      <button class="btn btn-download" id="downloadBtn" disabled>↓ WAVでダウンロード</button>
      <button class="btn btn-delete" id="clearBtn" disabled>すべて削除</button>
    </div>

    <div class="list-section">
      <div class="list-title">録音一覧</div>
      <div id="recordingList">
        <div class="empty-msg">まだ録音がありません</div>
      </div>
    </div>
  </div>

<script>
const recordBtn = document.getElementById('recordBtn');
const countdownEl = document.getElementById('countdown');
const countNum = document.getElementById('countNum');
const statusEl = document.getElementById('status');
const playAllBtn = document.getElementById('playAllBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const recordingList = document.getElementById('recordingList');
const nameInput = document.getElementById('nameInput');

// ---- 録音 ----
function getSupportedMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
  return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
}

// ---- WAVエンコード（クライアント側） ----
function encodeWAV(audioBuffer) {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const length = audioBuffer.length * numChannels;
  const interleaved = new Float32Array(length);

  for (let ch = 0; ch < numChannels; ch++) {
    const data = audioBuffer.getChannelData(ch);
    for (let i = 0; i < audioBuffer.length; i++) {
      interleaved[i * numChannels + ch] = data[i];
    }
  }

  const buffer = new ArrayBuffer(44 + length * 2);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, length * 2, true);

  let offset = 44;
  for (let i = 0; i < interleaved.length; i++) {
    const s = Math.max(-1, Math.min(1, interleaved[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }

  return buffer;
}

async function startRecording() {
  const name = nameInput.value.trim();
  if (!name) {
    setStatus('お名前を入力してください', 'error');
    nameInput.focus();
    return;
  }

  recordBtn.disabled = true;
  setStatus('マイクの許可を確認中...', '');

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus('マイクが使えません。許可してください。', 'error');
    recordBtn.disabled = false;
    return;
  }

  const chunks = [];
  const mimeType = getSupportedMimeType();
  const mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());

    try {
      setStatus('サーバーにアップロード中...', '');

      // 録音データをWAVに変換
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
      const arrayBuf = await blob.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const decoded = await audioCtx.decodeAudioData(arrayBuf);
      await audioCtx.close();
      const wavBuf = encodeWAV(decoded);
      const wavBlob = new Blob([wavBuf], { type: 'audio/wav' });

      // サーバーへアップロード
      const formData = new FormData();
      formData.append('audio', wavBlob, 'recording.wav');
      formData.append('name', name);
      const res = await fetch('/upload', { method: 'POST', body: formData });

      if (!res.ok) throw new Error('アップロード失敗');

      await refreshList();
      recordBtn.classList.remove('recording');
      recordBtn.disabled = false;
      nameInput.value = '';
      setStatus('録音を保存しました！', 'success');
      setTimeout(() => setStatus('ボタンを押してください', ''), 2500);
    } catch (e) {
      setStatus('エラー: ' + e.message, 'error');
      recordBtn.classList.remove('recording', 'countdown');
      recordBtn.disabled = false;
    }
  };

  // カウントダウン（3→2→1）
  recordBtn.classList.add('countdown');
  setStatus('準備してください...', '');

  let preCount = 3;
  countdownEl.textContent = preCount;

  await new Promise(resolve => {
    const preTimer = setInterval(() => {
      preCount--;
      if (preCount > 0) {
        countdownEl.textContent = preCount;
      } else {
        clearInterval(preTimer);
        resolve();
      }
    }, 1000);
  });

  // 録音開始（2秒）
  recordBtn.classList.remove('countdown');
  recordBtn.classList.add('recording');
  countdownEl.textContent = '●';
  setStatus('録音中...', '');
  mediaRecorder.start();

  setTimeout(() => mediaRecorder.stop(), 3000);
}

// ---- 一覧更新 ----
async function refreshList() {
  try {
    const res = await fetch('/list');
    const recs = await res.json();
    const hasRecs = recs.length > 0;

    countNum.textContent = recs.length;
    playAllBtn.disabled = !hasRecs;
    downloadBtn.disabled = !hasRecs;
    clearBtn.disabled = !hasRecs;

    if (recs.length === 0) {
      recordingList.innerHTML = '<div class="empty-msg">まだ録音がありません</div>';
      return;
    }

    recordingList.innerHTML = '';
    recs.forEach(rec => {
      const item = document.createElement('div');
      item.className = 'list-item';
      const dt = new Date(rec.timestamp);
      const time = `${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const nameStr = rec.name ? `<span class="list-name">${rec.name}</span>` : '<span style="color:#ccc">名前なし</span>';
      item.innerHTML = `
        <div class="list-item-left">
          <span class="list-num">#${rec.index}</span>
          ${nameStr}
          <span class="list-time">${time}</span>
        </div>
        <button class="list-delete" data-filename="${rec.filename}" title="削除">✕</button>
      `;
      recordingList.appendChild(item);
    });

    recordingList.querySelectorAll('.list-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('この録音を削除しますか？')) return;
        await fetch(`/recording/${encodeURIComponent(btn.dataset.filename)}`, { method: 'DELETE' });
        await refreshList();
      });
    });
  } catch (e) {
    setStatus('サーバーに接続できません', 'error');
  }
}

// ---- ボタン ----
recordBtn.addEventListener('click', startRecording);

playAllBtn.addEventListener('click', async () => {
  setStatus('再生中...', 'success');
  playAllBtn.disabled = true;
  try {
    const res = await fetch('/download');
    if (!res.ok) throw new Error('取得失敗');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.play();
    audio.onended = () => {
      URL.revokeObjectURL(url);
      setStatus('再生完了', 'success');
      setTimeout(() => setStatus('ボタンを押してください', ''), 2000);
    };
  } catch (e) {
    setStatus('再生に失敗しました', 'error');
  }
  playAllBtn.disabled = false;
});

downloadBtn.addEventListener('click', async () => {
  setStatus('ダウンロード中...', '');
  downloadBtn.disabled = true;
  try {
    const res = await fetch('/download');
    if (!res.ok) throw new Error('取得失敗');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `arigatou_${new Date().toISOString().slice(0,10)}.wav`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    setStatus('ダウンロードしました！', 'success');
    setTimeout(() => setStatus('ボタンを押してください', ''), 2500);
  } catch (e) {
    setStatus('ダウンロードに失敗しました', 'error');
  }
  downloadBtn.disabled = false;
});

clearBtn.addEventListener('click', async () => {
  const count = parseInt(countNum.textContent);
  if (!confirm(`${count}件の録音をすべて削除しますか？`)) return;
  await fetch('/clear', { method: 'DELETE' });
  await refreshList();
  setStatus('すべて削除しました', '');
});

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

// 起動時に一覧取得
refreshList();
</script>
</body>
</html>
