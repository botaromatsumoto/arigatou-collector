<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありがとうコレクター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #fff9e6 0%, #ffe8f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #c0392b;
      margin-bottom: 4px;
      text-align: center;
    }

    .event-name {
      font-size: 1rem;
      color: #e74c3c;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 40px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }

    #recordBtn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 6px 20px rgba(231,76,60,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 auto 28px;
    }

    #recordBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 28px rgba(231,76,60,0.5);
    }

    #recordBtn:disabled { cursor: not-allowed; opacity: 0.6; }

    #recordBtn.recording {
      animation: pulse 0.8s ease-in-out infinite;
      background: linear-gradient(135deg, #e74c3c, #922b21);
    }

    #recordBtn.countdown {
      background: linear-gradient(135deg, #f39c12, #d68910);
      box-shadow: 0 6px 20px rgba(243,156,18,0.4);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); }
      50% { box-shadow: 0 0 0 20px rgba(231,76,60,0); }
    }

    .mic-icon { font-size: 2.4rem; }
    #countdown { font-size: 3.5rem; font-weight: bold; color: white; display: none; }

    #recordBtn.countdown .mic-icon { display: none; }
    #recordBtn.countdown .btn-label { display: none; }
    #recordBtn.countdown #countdown { display: block; }
    #recordBtn.recording .mic-icon { display: none; }
    #recordBtn.recording .btn-label { display: none; }
    #recordBtn.recording #countdown { display: block; }

    /* 録音確認エリア */
    .review-area {
      display: none;
      margin-bottom: 28px;
      background: #f0f9ff;
      border: 2px solid #b2dfdb;
      border-radius: 16px;
      padding: 18px 16px 14px;
    }
    .review-area.visible { display: block; }

    .review-label {
      font-size: 0.9rem;
      color: #27ae60;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #previewAudio {
      width: 100%;
      margin-bottom: 14px;
      border-radius: 8px;
    }

    .review-btns {
      display: flex;
      gap: 10px;
    }

    #okBtn {
      flex: 1;
      padding: 14px 10px;
      border-radius: 12px;
      border: 2px solid #b2dfdb;
      background: #e8f8f5;
      color: #27ae60;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    #okBtn:hover:not(:disabled) { background: #d0f0e8; }
    #okBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #retakeBtn {
      flex: 1;
      padding: 14px 10px;
      border-radius: 12px;
      border: 2px solid #f5c6c6;
      background: #fff8f8;
      color: #e74c3c;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    #retakeBtn:hover:not(:disabled) { background: #fee; }
    #retakeBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    .count-area {
      background: #fff9e6;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .count-label { font-size: 0.85rem; color: #888; margin-bottom: 4px; }
    .count-number { font-size: 2.2rem; font-weight: bold; color: #e74c3c; }
    .count-unit { font-size: 1rem; color: #c0392b; margin-left: 4px; }

    #status {
      min-height: 24px;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 16px;
    }
    #status.success { color: #27ae60; font-weight: bold; }
    #status.error { color: #e74c3c; }

    .name-input-area {
      margin-bottom: 24px;
      text-align: left;
    }
    .name-input-area label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 6px;
    }
    .name-input-area input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #f5c6c6;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .name-input-area input:focus { border-color: #e74c3c; }

    /* ダウンロードボタン */
    #downloadBtn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 12px;
      border: 2px solid #b2dfdb;
      background: #e8f8f5;
      color: #1a8a6a;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    #downloadBtn:hover { background: #c8efe8; }

    .notice {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #aaa;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>ありがとうコレクター</h1>
  <p class="event-name" id="eventName"></p>
  <p class="subtitle">みんなの「ありがとう」を集めてひとつの音声にします</p>

  <div class="card">
    <div class="name-input-area">
      <label for="nameInput">お名前を入力してください</label>
      <input type="text" id="nameInput" placeholder="例：田中 太郎" maxlength="30">
    </div>

    <button id="recordBtn" title="タップして録音">
      <span class="mic-icon">🎤</span>
      <span class="btn-label">タップして<br>録音（3秒）</span>
      <span id="countdown">3</span>
    </button>

    <!-- 録音確認エリア（録音後・アップロード前に表示） -->
    <div class="review-area" id="reviewArea">
      <p class="review-label">録音を確認してください</p>
      <audio id="previewAudio" controls></audio>
      <div class="review-btns">
        <button id="okBtn">OK（保存する）</button>
        <button id="retakeBtn">やり直す</button>
      </div>
    </div>

    <div class="count-area">
      <div class="count-label">集まった「ありがとう」</div>
      <div>
        <span class="count-number" id="countNum">0</span>
        <span class="count-unit">件</span>
      </div>
    </div>

    <div id="status">ボタンを押してください</div>

    <button id="downloadBtn">みんなの「ありがとう」をダウンロード</button>

    <p class="notice">お友達からLINEなどでこちらのリンクをもらった場合、録音ボタンを押しても反応しないことがあります。そのときは右下などにある・・・などのボタンをタップしてブラウザで開いてから録音してみてください。</p>
  </div>

<script>
const eventId = window.location.pathname.split('/')[2];

const recordBtn = document.getElementById('recordBtn');
const countdownEl = document.getElementById('countdown');
const countNum = document.getElementById('countNum');
const statusEl = document.getElementById('status');
const nameInput = document.getElementById('nameInput');
const reviewArea = document.getElementById('reviewArea');
const previewAudio = document.getElementById('previewAudio');
const okBtn = document.getElementById('okBtn');
const retakeBtn = document.getElementById('retakeBtn');
const downloadBtn = document.getElementById('downloadBtn');

let pendingWavBlob = null;
let pendingName = null;
let pendingAudioUrl = null;

function showReviewArea() { reviewArea.classList.add('visible'); }
function hideReviewArea() { reviewArea.classList.remove('visible'); }

// イベント名を表示
fetch(`/event-info/${eventId}`)
  .then(r => r.json())
  .then(d => { document.getElementById('eventName').textContent = d.name; document.title = d.name + ' | ありがとうコレクター'; })
  .catch(() => {});

// ---- 録音 ----
function getSupportedMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
  return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
}

function encodeWAV(audioBuffer) {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const length = audioBuffer.length * numChannels;
  const interleaved = new Float32Array(length);
  for (let ch = 0; ch < numChannels; ch++) {
    const data = audioBuffer.getChannelData(ch);
    for (let i = 0; i < audioBuffer.length; i++) interleaved[i * numChannels + ch] = data[i];
  }
  const buffer = new ArrayBuffer(44 + length * 2);
  const view = new DataView(buffer);
  function writeStr(offset, str) { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); }
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, length * 2, true);
  let offset = 44;
  for (let i = 0; i < interleaved.length; i++) {
    const s = Math.max(-1, Math.min(1, interleaved[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }
  return buffer;
}

async function startRecording() {
  const name = nameInput.value.trim();
  if (!name) { setStatus('お名前を入力してください', 'error'); nameInput.focus(); return; }

  pendingWavBlob = null;
  pendingName = null;
  if (pendingAudioUrl) { URL.revokeObjectURL(pendingAudioUrl); pendingAudioUrl = null; }
  hideReviewArea();
  recordBtn.disabled = true;
  setStatus('マイクの許可を確認中...', '');

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    setStatus('マイクが使えません。許可してください。', 'error');
    recordBtn.disabled = false;
    return;
  }

  const chunks = [];
  const mimeType = getSupportedMimeType();
  const mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    try {
      setStatus('処理中...', '');
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
      const arrayBuf = await blob.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const decoded = await audioCtx.decodeAudioData(arrayBuf);
      await audioCtx.close();
      pendingWavBlob = new Blob([encodeWAV(decoded)], { type: 'audio/wav' });
      pendingName = name;

      pendingAudioUrl = URL.createObjectURL(pendingWavBlob);
      previewAudio.src = pendingAudioUrl;
      previewAudio.load();

      recordBtn.classList.remove('recording');
      setStatus('録音できました。内容を確認してください。', '');
      showReviewArea();
    } catch (e) {
      setStatus('エラー: ' + e.message, 'error');
      recordBtn.classList.remove('recording', 'countdown');
      recordBtn.disabled = false;
    }
  };

  // カウントダウン（3→2→1）
  recordBtn.classList.add('countdown');
  setStatus('準備してください...', '');
  let preCount = 3;
  countdownEl.textContent = preCount;
  await new Promise(resolve => {
    const t = setInterval(() => {
      preCount--;
      if (preCount > 0) { countdownEl.textContent = preCount; }
      else { clearInterval(t); resolve(); }
    }, 1000);
  });

  // 録音開始（3秒）
  recordBtn.classList.remove('countdown');
  recordBtn.classList.add('recording');
  countdownEl.textContent = '●';
  setStatus('録音中...', '');
  mediaRecorder.start();
  setTimeout(() => mediaRecorder.stop(), 3000);
}

// ---- OKボタン（サーバーにアップロード） ----
okBtn.addEventListener('click', async () => {
  if (!pendingWavBlob) return;

  okBtn.disabled = true;
  retakeBtn.disabled = true;
  setStatus('サーバーに保存中...', '');

  try {
    const formData = new FormData();
    formData.append('audio', pendingWavBlob, 'recording.wav');
    formData.append('name', pendingName);
    const res = await fetch(`/upload/${eventId}`, { method: 'POST', body: formData });
    if (!res.ok) throw new Error('アップロード失敗');

    URL.revokeObjectURL(pendingAudioUrl);
    pendingWavBlob = null;
    pendingName = null;
    pendingAudioUrl = null;

    await refreshCount();
    hideReviewArea();
    nameInput.value = '';
    recordBtn.disabled = false;
    okBtn.disabled = false;
    retakeBtn.disabled = false;
    setStatus('録音を保存しました！', 'success');
    setTimeout(() => setStatus('ボタンを押してください', ''), 2500);
  } catch (e) {
    setStatus('エラー: ' + e.message, 'error');
    okBtn.disabled = false;
    retakeBtn.disabled = false;
  }
});

// ---- やり直すボタン（ローカルデータを破棄して再録音） ----
retakeBtn.addEventListener('click', () => {
  if (pendingAudioUrl) { URL.revokeObjectURL(pendingAudioUrl); pendingAudioUrl = null; }
  pendingWavBlob = null;
  hideReviewArea();
  recordBtn.disabled = false;
  setStatus('もう一度録音してください', '');
});

// ---- ダウンロードボタン ----
downloadBtn.addEventListener('click', () => {
  window.location.href = `/public-download/${eventId}`;
});

// ---- 件数更新 ----
async function refreshCount() {
  try {
    const [listRes, offsetRes] = await Promise.all([fetch(`/list/${eventId}`), fetch(`/offset/${eventId}`)]);
    const recs = await listRes.json();
    const { offset } = await offsetRes.json();
    countNum.textContent = offset + recs.length;
  } catch {}
}

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

recordBtn.addEventListener('click', startRecording);
refreshCount();
</script>
</body>
</html>
