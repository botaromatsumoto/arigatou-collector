<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありがとうコレクター 管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #fff9e6 0%, #ffe8f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 { font-size: 1.8rem; color: #c0392b; margin-bottom: 4px; text-align: center; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 32px; text-align: center; }

    .card {
      background: white;
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    /* ログイン */
    .login-label { font-size: 0.9rem; color: #888; margin-bottom: 10px; text-align: center; display: block; }
    .login-row { display: flex; gap: 10px; }
    .login-row input {
      flex: 1; padding: 12px 16px; border: 2px solid #f5c6c6;
      border-radius: 12px; font-size: 1rem; outline: none; font-family: inherit; transition: border-color 0.2s;
    }
    .login-row input:focus { border-color: #e74c3c; }
    #loginError { color: #e74c3c; font-size: 0.88rem; margin-top: 8px; text-align: center; min-height: 20px; }

    /* ボタン */
    .btn {
      padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer;
      font-size: 0.95rem; font-weight: bold; transition: opacity 0.2s, transform 0.1s; font-family: inherit;
    }
    .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-login { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
    .btn-blue { background: #3498db; color: white; }
    .btn-green { background: #27ae60; color: white; }
    .btn-gray { background: #f0f0f0; color: #555; font-size: 0.85rem; padding: 8px 14px; }
    .btn-danger { background: #fff0f0; color: #e74c3c; border: 1px solid #f5c6c6; font-size: 0.85rem; padding: 8px 14px; }

    /* イベント作成 */
    .create-section h2 { font-size: 1rem; color: #555; margin-bottom: 14px; }
    .create-row { display: flex; gap: 10px; }
    .create-row input {
      flex: 1; padding: 12px 16px; border: 2px solid #f5c6c6;
      border-radius: 12px; font-size: 1rem; outline: none; font-family: inherit; transition: border-color 0.2s;
    }
    .create-row input:focus { border-color: #e74c3c; }
    #createStatus { font-size: 0.85rem; margin-top: 8px; min-height: 18px; color: #27ae60; }

    /* イベント一覧 */
    .events-section h2 { font-size: 1rem; color: #555; margin-bottom: 14px; }
    .event-list { display: flex; flex-direction: column; gap: 14px; }
    .empty-msg { color: #ccc; font-size: 0.9rem; text-align: center; padding: 20px; }

    .event-card {
      border: 2px solid #f5e6e8;
      border-radius: 16px;
      padding: 18px 20px;
      background: #fffafa;
    }
    .event-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .event-title { font-size: 1.05rem; font-weight: bold; color: #333; }
    .event-count { font-size: 0.85rem; color: #888; }
    .event-count span { font-weight: bold; color: #e74c3c; font-size: 1rem; }

    .event-url-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .event-url {
      flex: 1; padding: 8px 12px; background: #f5f5f5; border-radius: 8px;
      font-size: 0.8rem; color: #555; word-break: break-all; border: 1px solid #eee;
    }

    .event-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* 詳細パネル */
    .event-detail { display: none; margin-top: 14px; border-top: 1px solid #f0e0e0; padding-top: 14px; }
    .event-detail.open { display: block; }

    .recording-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
    .rec-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #f9f9f9; border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; color: #555;
    }
    .rec-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .rec-num { font-weight: bold; color: #e74c3c; min-width: 22px; }
    .rec-name { font-weight: bold; color: #333; }
    .rec-time { color: #aaa; font-size: 0.78rem; }
    .rec-delete {
      background: none; border: none; cursor: pointer; color: #ccc; font-size: 0.9rem;
      padding: 2px 6px; border-radius: 5px; transition: color 0.1s, background 0.1s; flex-shrink: 0;
    }
    .rec-delete:hover { color: #e74c3c; background: #fee; }

    .offset-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .offset-row label { font-size: 0.85rem; color: #888; white-space: nowrap; }
    .offset-row input {
      width: 90px; padding: 8px 10px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 0.95rem; font-weight: bold; outline: none; font-family: inherit;
    }
    .offset-row input:focus { border-color: #3498db; }
    .offset-status { font-size: 0.8rem; color: #27ae60; margin-top: 4px; min-height: 16px; }

    .bgm-section { margin-top: 14px; border-top: 1px solid #f0e0e0; padding-top: 14px; }
    .bgm-section label { font-size: 0.85rem; color: #888; display: block; margin-bottom: 8px; }
    .bgm-file-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .bgm-file-row input[type="file"] { font-size: 0.82rem; color: #555; flex: 1; min-width: 0; }
    .bgm-volume-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .bgm-volume-row span { font-size: 0.85rem; color: #888; white-space: nowrap; }
    .bgm-volume-row input[type="range"] { flex: 1; accent-color: #3498db; }
    .bgm-vol-label { font-size: 0.85rem; font-weight: bold; color: #3498db; min-width: 36px; }
    .bgm-status { font-size: 0.82rem; color: #888; margin-top: 6px; min-height: 16px; }

    .logout-link {
      display: block; text-align: center; margin-top: 8px;
      font-size: 0.85rem; color: #aaa; cursor: pointer; text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>ありがとうコレクター</h1>
  <p class="subtitle">管理者ページ</p>

  <!-- ログインフォーム -->
  <div class="card" id="loginSection">
    <span class="login-label">パスワードを入力してください</span>
    <div class="login-row">
      <input type="password" id="passwordInput" placeholder="パスワード">
      <button class="btn btn-login" id="loginBtn">ログイン</button>
    </div>
    <div id="loginError"></div>
  </div>

  <!-- 管理パネル -->
  <div id="adminSection" style="display:none; width:100%; max-width:560px;">

    <!-- イベント作成 -->
    <div class="card create-section">
      <h2>新しいイベントを作成</h2>
      <div class="create-row">
        <input type="text" id="eventNameInput" placeholder="例：2026年卒業式" maxlength="50">
        <button class="btn btn-primary" id="createBtn">作成</button>
      </div>
      <div id="createStatus"></div>
    </div>

    <!-- イベント一覧 -->
    <div class="card events-section">
      <h2>イベント一覧</h2>
      <div class="event-list" id="eventList">
        <div class="empty-msg">まだイベントがありません</div>
      </div>
    </div>

    <span class="logout-link" id="logoutLink">ログアウト</span>
  </div>

<script>
const loginSection = document.getElementById('loginSection');
const adminSection = document.getElementById('adminSection');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

const savedPw = sessionStorage.getItem('adminPw');
if (savedPw) tryLogin(savedPw, true);

loginBtn.addEventListener('click', () => tryLogin(passwordInput.value, false));
passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(passwordInput.value, false); });

async function tryLogin(pw, silent) {
  try {
    const res = await fetch('/admin/verify', { headers: { 'X-Admin-Password': pw } });
    if (res.ok) {
      sessionStorage.setItem('adminPw', pw);
      loginSection.style.display = 'none';
      adminSection.style.display = 'block';
      loadEvents();
    } else {
      if (!silent) loginError.textContent = 'パスワードが違います';
    }
  } catch {
    if (!silent) loginError.textContent = 'サーバーに接続できません';
  }
}

function getHeaders() {
  return { 'X-Admin-Password': sessionStorage.getItem('adminPw') || '' };
}

// ---- イベント作成 ----
document.getElementById('createBtn').addEventListener('click', async () => {
  const name = document.getElementById('eventNameInput').value.trim();
  if (!name) { showCreateStatus('イベント名を入力してください', 'error'); return; }
  try {
    const res = await fetch('/admin/events', {
      method: 'POST',
      headers: { ...getHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    if (!res.ok) throw new Error();
    document.getElementById('eventNameInput').value = '';
    showCreateStatus('イベントを作成しました', 'ok');
    setTimeout(() => showCreateStatus('', ''), 3000);
    loadEvents();
  } catch {
    showCreateStatus('作成に失敗しました', 'error');
  }
});

function showCreateStatus(msg, type) {
  const el = document.getElementById('createStatus');
  el.textContent = msg;
  el.style.color = type === 'error' ? '#e74c3c' : '#27ae60';
}

// ---- イベント一覧 ----
async function loadEvents() {
  try {
    const res = await fetch('/admin/events', { headers: getHeaders() });
    const events = await res.json();
    const list = document.getElementById('eventList');

    if (events.length === 0) {
      list.innerHTML = '<div class="empty-msg">まだイベントがありません</div>';
      return;
    }

    list.innerHTML = '';
    events.forEach(ev => {
      const url = `${location.origin}/event/${ev.id}`;
      const total = ev.offset + ev.count;

      const div = document.createElement('div');
      div.className = 'event-card';
      div.innerHTML = `
        <div class="event-header">
          <span class="event-title">${escHtml(ev.name)}</span>
          <span class="event-count">合計 <span>${total}</span> 件（録音 ${ev.count} 件）</span>
        </div>
        <div class="event-url-row">
          <div class="event-url">${url}</div>
          <button class="btn btn-gray copy-btn" data-url="${url}">コピー</button>
        </div>
        <div class="event-actions">
          <button class="btn btn-gray detail-btn">録音を管理</button>
          <button class="btn btn-green download-btn" data-id="${ev.id}" ${ev.count === 0 ? 'disabled' : ''}>↓ WAVダウンロード</button>
          <button class="btn btn-danger delete-event-btn" data-id="${ev.id}" data-name="${escHtml(ev.name)}">イベント削除</button>
        </div>
        <div class="event-detail" id="detail-${ev.id}">
          <div class="recording-list" id="reclist-${ev.id}"></div>
          <div class="event-actions">
            <button class="btn btn-danger clear-btn" data-id="${ev.id}" ${ev.count === 0 ? 'disabled' : ''}>録音をすべて削除</button>
          </div>
          <div class="offset-row">
            <label>ベース件数：</label>
            <input type="number" min="0" value="${ev.offset}" class="offset-input" data-id="${ev.id}">
            <button class="btn btn-gray offset-save-btn" data-id="${ev.id}">保存</button>
          </div>
          <div class="offset-status" id="offset-status-${ev.id}"></div>
          <div class="bgm-section">
            <label>BGMつきでダウンロード</label>
            <div class="bgm-file-row">
              <input type="file" accept="audio/*" class="bgm-input" data-id="${ev.id}">
            </div>
            <div class="bgm-volume-row">
              <span>BGM音量：</span>
              <input type="range" min="0" max="100" value="30" class="bgm-volume" data-id="${ev.id}">
              <span class="bgm-vol-label" id="bgm-vol-label-${ev.id}">30%</span>
            </div>
            <button class="btn btn-blue bgm-download-btn" data-id="${ev.id}" ${ev.count === 0 ? 'disabled' : ''}>♪ BGMつきでダウンロード</button>
            <div class="bgm-status" id="bgm-status-${ev.id}"></div>
          </div>
        </div>
      `;
      list.appendChild(div);

      // コピー
      div.querySelector('.copy-btn').addEventListener('click', function() {
        navigator.clipboard.writeText(this.dataset.url).then(() => {
          this.textContent = 'コピー済み';
          setTimeout(() => { this.textContent = 'コピー'; }, 2000);
        });
      });

      // 録音を管理（トグル）
      div.querySelector('.detail-btn').addEventListener('click', function() {
        const detail = document.getElementById(`detail-${ev.id}`);
        const isOpen = detail.classList.toggle('open');
        this.textContent = isOpen ? '閉じる' : '録音を管理';
        if (isOpen) loadRecordings(ev.id);
      });

      // WAVダウンロード
      div.querySelector('.download-btn').addEventListener('click', async function() {
        this.disabled = true;
        this.textContent = 'ダウンロード中...';
        try {
          const res = await fetch(`/download/${ev.id}`, { headers: getHeaders() });
          if (!res.ok) throw new Error();
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `arigatou_${ev.id}_${new Date().toISOString().slice(0,10)}.wav`;
          document.body.appendChild(a); a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
        } catch { alert('ダウンロードに失敗しました'); }
        this.disabled = false;
        this.textContent = '↓ WAVダウンロード';
      });

      // 録音全削除
      div.querySelector('.clear-btn').addEventListener('click', async function() {
        if (!confirm(`「${ev.name}」の録音をすべて削除しますか？`)) return;
        await fetch(`/clear/${ev.id}`, { method: 'DELETE', headers: getHeaders() });
        loadEvents();
      });

      // イベント削除
      div.querySelector('.delete-event-btn').addEventListener('click', async function() {
        if (!confirm(`「${this.dataset.name}」を削除しますか？\n録音データもすべて削除されます。`)) return;
        await fetch(`/admin/events/${this.dataset.id}`, { method: 'DELETE', headers: getHeaders() });
        loadEvents();
      });

      // BGM音量ラベル更新
      div.querySelector('.bgm-volume').addEventListener('input', function() {
        document.getElementById(`bgm-vol-label-${this.dataset.id}`).textContent = this.value + '%';
      });

      // BGMつきダウンロード
      div.querySelector('.bgm-download-btn').addEventListener('click', async function() {
        const id = this.dataset.id;
        const fileInput = div.querySelector(`.bgm-input[data-id="${id}"]`);
        const volumeInput = div.querySelector(`.bgm-volume[data-id="${id}"]`);
        if (!fileInput.files[0]) {
          document.getElementById(`bgm-status-${id}`).textContent = 'BGMファイルを選択してください';
          return;
        }
        this.disabled = true;
        await downloadWithBGM(id, fileInput.files[0], parseInt(volumeInput.value) / 100);
        this.disabled = false;
      });

      // ベース件数保存
      div.querySelector('.offset-save-btn').addEventListener('click', async function() {
        const id = this.dataset.id;
        const n = parseInt(div.querySelector(`.offset-input[data-id="${id}"]`).value);
        if (isNaN(n) || n < 0) { showOffsetStatus(id, '0以上の数値を入力してください', 'error'); return; }
        try {
          const res = await fetch(`/admin/offset/${id}`, {
            method: 'POST',
            headers: { ...getHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ offset: n })
          });
          if (!res.ok) throw new Error();
          showOffsetStatus(id, `${n}件 に設定しました`, 'ok');
          setTimeout(() => showOffsetStatus(id, '', ''), 3000);
          loadEvents();
        } catch { showOffsetStatus(id, '保存に失敗しました', 'error'); }
      });
    });
  } catch {
    document.getElementById('eventList').innerHTML = '<div class="empty-msg">読み込みに失敗しました</div>';
  }
}

function showOffsetStatus(id, msg, type) {
  const el = document.getElementById(`offset-status-${id}`);
  if (!el) return;
  el.textContent = msg;
  el.style.color = type === 'error' ? '#e74c3c' : '#27ae60';
}

async function loadRecordings(eventId) {
  const container = document.getElementById(`reclist-${eventId}`);
  try {
    const res = await fetch(`/list/${eventId}`, { headers: getHeaders() });
    const recs = await res.json();
    if (recs.length === 0) { container.innerHTML = '<div class="empty-msg">まだ録音がありません</div>'; return; }
    container.innerHTML = '';
    recs.forEach(rec => {
      const item = document.createElement('div');
      item.className = 'rec-item';
      const dt = new Date(rec.timestamp);
      const time = `${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const nameStr = rec.name ? `<span class="rec-name">${escHtml(rec.name)}</span>` : '<span style="color:#ccc">名前なし</span>';
      item.innerHTML = `
        <div class="rec-left">
          <span class="rec-num">#${rec.index}</span>
          ${nameStr}
          <span class="rec-time">${time}</span>
        </div>
        <button class="rec-delete" data-filename="${rec.filename}" title="削除">✕</button>
      `;
      container.appendChild(item);
      item.querySelector('.rec-delete').addEventListener('click', async function() {
        if (!confirm('この録音を削除しますか？')) return;
        await fetch(`/recording/${eventId}/${encodeURIComponent(this.dataset.filename)}`, { method: 'DELETE', headers: getHeaders() });
        loadRecordings(eventId);
        loadEvents();
      });
    });
  } catch { container.innerHTML = '<div class="empty-msg">読み込みに失敗しました</div>'; }
}

// ---- WAVエンコード ----
function encodeWAV(audioBuffer) {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const length = audioBuffer.length * numChannels;
  const interleaved = new Float32Array(length);
  for (let ch = 0; ch < numChannels; ch++) {
    const data = audioBuffer.getChannelData(ch);
    for (let i = 0; i < audioBuffer.length; i++) interleaved[i * numChannels + ch] = data[i];
  }
  const buffer = new ArrayBuffer(44 + length * 2);
  const view = new DataView(buffer);
  function writeStr(o, s) { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
  writeStr(0, 'RIFF'); view.setUint32(4, 36 + length * 2, true);
  writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true); view.setUint16(34, 16, true);
  writeStr(36, 'data'); view.setUint32(40, length * 2, true);
  let offset = 44;
  for (let i = 0; i < interleaved.length; i++) {
    const s = Math.max(-1, Math.min(1, interleaved[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }
  return buffer;
}

// ---- BGMミックスダウンロード ----
async function downloadWithBGM(eventId, bgmFile, bgmVolume) {
  const statusEl = document.getElementById(`bgm-status-${eventId}`);
  statusEl.textContent = '音声を取得中...';

  try {
    const [voiceRes, bgmArrayBuf] = await Promise.all([
      fetch(`/download/${eventId}`, { headers: getHeaders() }),
      bgmFile.arrayBuffer()
    ]);
    if (!voiceRes.ok) throw new Error('音声の取得失敗');
    const voiceArrayBuf = await voiceRes.arrayBuffer();

    statusEl.textContent = 'ミックス中...';
    const audioCtx = new AudioContext();
    const [voiceBuf, bgmBuf] = await Promise.all([
      audioCtx.decodeAudioData(voiceArrayBuf),
      audioCtx.decodeAudioData(bgmArrayBuf)
    ]);

    const sampleRate = voiceBuf.sampleRate;
    const length = voiceBuf.length;
    const numChannels = voiceBuf.numberOfChannels;
    const outputBuf = audioCtx.createBuffer(numChannels, length, sampleRate);

    for (let ch = 0; ch < numChannels; ch++) {
      const voiceData = voiceBuf.getChannelData(ch);
      const bgmCh = Math.min(ch, bgmBuf.numberOfChannels - 1);
      const bgmData = bgmBuf.getChannelData(bgmCh);
      const out = outputBuf.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const bgmSample = bgmData[i % bgmBuf.length] * bgmVolume;
        out[i] = Math.max(-1, Math.min(1, voiceData[i] + bgmSample));
      }
    }
    await audioCtx.close();

    const wavBuf = encodeWAV(outputBuf);
    const blob = new Blob([wavBuf], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `arigatou_bgm_${eventId}_${new Date().toISOString().slice(0,10)}.wav`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    statusEl.textContent = 'ダウンロードしました！';
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
  } catch (e) {
    statusEl.textContent = 'エラー: ' + e.message;
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('logoutLink').addEventListener('click', () => {
  sessionStorage.removeItem('adminPw');
  adminSection.style.display = 'none';
  loginSection.style.display = 'block';
  passwordInput.value = '';
  loginError.textContent = '';
});
</script>
</body>
</html>
